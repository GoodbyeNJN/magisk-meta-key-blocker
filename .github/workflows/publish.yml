name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Archive
        run: zip -r magisk-meta-key-blocker-${{ github.ref_name }}.zip . -x .github/\* -x .git/\* -x .gitignore

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: magisk-meta-key-blocker-${{ github.ref_name }}.zip
